ai:
  base_url: https://api.deepseek.com
  mode: full_auto
  model: deepseek-v4-flash
  tasks:
    coin_selection_minutes: 240
    market_assessment_minutes: 60
    risk_adjustment_minutes: 1440
    strategy_optimization_minutes: 1440
auth:
  jwt_secret: ''
  session_hours: 24
backtest:
  # NOTE: the backtest cost model is deliberately kept separate from `sim:` below
  # (it charges fees at close time only, on top of the entry/exit prices, so that
  # stop-loss / take-profit levels are untouched).  Do not merge the two.
  cost_model:
    enabled: true
    # Per-symbol **full** quoted spread (%) OVERRIDES — the cost model charges
    # half of it on entry and half on exit (`spread / 2`, see
    # core/backtest/cost_model.py), the same convention as `sim.cost_model`.
    # Resolution order for every pair a run
    # actually uses: override (this map, or a value typed in the UI) →
    # live-derived from GET {binance.market_data_host}/api/v3/depth
    # (best bid/ask, cached `live_spread.ttl_seconds`) → `default_spread_pct`.
    # A `default: 0.x` key here overrides the fallback for every symbol.
    spread_pct:
      BNBUSDT: 0.03
      BTCUSDT: 0.01
      ETHUSDT: 0.02
      SOLUSDT: 0.03
      XRPUSDT: 0.04
    # Documented last resort for an unknown pair / unreachable data host.
    default_spread_pct: 0.03
    # Live spread derivation from the public order book.
    live_spread:
      enabled: true
      ttl_seconds: 300
      timeout_seconds: 3
    taker_fee_pct: 0.04
  engine_mode: auto
  ml_enabled: false
# Genetic-algorithm evaluation settings (P1 — GA credibility).  These control how
# a genome is SCORED; they never change live trading.
ga:
  # Historical fills are never priced from TODAY's order book: an unmapped symbol
  # resolves to `backtest.cost_model.default_spread_pct` and the resolved source
  # ("override"/"default") is recorded in the run metrics and champion provenance.
  # true only for a deliberate "what would today's book cost" experiment.
  use_live_spread: false
  # A champion with fewer completed trades than this is written with
  # `enabled: false` and a `rejection_reasons` list in its provenance block.
  min_champion_trades: 30
  # Weight of the risk-adjusted term in the fitness formula:
  # DSR-deflated Sharpe * √365 * min(1, trades/30) - max drawdown.  Read by the
  # GA evolver (`config.ga_alpha_weight` -> `score_stats(alpha_weight=...)`).
  #
  # The equal-weighted buy & hold of the same window/symbols is NOT part of the
  # fitness sum (audit D-16): it is reported as `alpha_vs_buy_hold_pct` and used
  # by the PUBLICATION GATE and the champion provenance, nothing else.
  alpha_weight: 1.0
  # NOTE: there is deliberately no `evaluation_leverage` key.  GA/backtest
  # evaluation is a cash model because the engine has no leverage input at all
  # (`leverage` appears 0 times in core/ga/** and core/backtest/engine.py); a
  # config key promising an override would be a lie, so the mismatch with
  # `risk_params.yaml` leverage is stated in the champion provenance instead.
binance:
  # Trading/account client (orders, balances). testnet.binance.vision is reachable.
  testnet: true
  # Public mainnet market data mirror: api.binance.com is unreachable from this
  # host, data-api.binance.vision serves the whole spot market (3716 symbols).
  market_data_host: https://data-api.binance.vision
  market_stream_host: wss://data-stream.binance.vision
core_position:
  capital_pct: 0.7
  max_symbols: 5
language: zh
ml:
  # ── ML credibility gate (docs/overhaul/ALGO_UPGRADE_PLAN.md §二 P2) ──
  # SAFE DEFAULT: enabled=false.  The measured live model is worse than the
  # majority class (accuracy 0.41–0.47 vs 0.54–0.67; OOS AUC 0.396–0.447) and
  # anti-calibrated (predicted 0.91 → realised 0.22), so turning ML on is a
  # measured negative contribution.  A model may only be used when the
  # purged/embargoed out-of-sample evaluation passes BOTH gate conditions.
  enabled: false
  # 'lightgbm' (tabular, default) or 'tft' (sequence).
  model_type: lightgbm
  # 'isotonic' or 'platt' — fitted on a held-out slice, persisted with the model.
  calibration: isotonic
  # Hard thresholds (plan §二 P2.1 / §三.2), all consumed by
  # `credibility_gate` via `MLPredictor._gate_config()`.
  gate_auc_min: 0.55
  gate_net_expectancy_min: 0.0
  # Significance floor (audit P2 #3, tightened by audit F3): a candidate must show
  # at least this many OUTER trades AND **both** t > gate_min_t_stat **and**
  # PSR >= gate_min_psr.  As an `or` the PSR floor was equivalent to t >= 1.645
  # under normality (PSR is the one-sided normal probability), which silently
  # weakened the 2.0 t floor; both keys are read by `MLPredictor._gate_config()`.
  # A missing t or PSR is a REFUSAL ("no significance evidence"), never a pass.
  # The audited "best" candidates had 27 trades / t=1.28 (BTC) and 77 / t=0.30
  # (ETH), so both are refused on this alone.
  gate_min_trades: 100
  gate_min_t_stat: 2.0
  gate_min_psr: 0.95
  # Enough out-of-sample rows for the AUC to mean anything.
  min_oos_rows: 100
  # feature_list: null → the canonical contract in core/ml/features.py
  # (FEATURE_NAMES).  Setting it replaces the contract everywhere (live AND
  # backtest); a column outside the contract is a hard error.
  feature_list: null
  # Per-interval label horizon/threshold: `label_params.<interval>` wins, then
  # these documented defaults.
  forward_periods: 4
  label_threshold: 0.005
  # Effective label threshold = max(label_threshold, k * round-trip cost).
  # 0.0 = the audited ±0.5 % threshold (40.5 % of BTC 1h bars tradeable, 59.5 %
  # flat/abstain).  Raise it so the target must clear a multiple of its cost.
  label_cost_multiple: 0.0
  # Strategy max holding period in bars — the triple-barrier TIME barrier must
  # match it (the old fixed 24×2% made 44.9% of labels timeouts).
  max_hold_bars: 24
  # Embargo for the purged K-fold split; default = label horizon.
  embargo_bars: 4
  # Volatility-scaled barrier width (ATR multiple, clamped).
  barrier_atr_period: 14
  barrier_atr_multiple: 1.5
  barrier_min_pct: 0.004
  barrier_max_pct: 0.06
  # Decision threshold on the calibrated P(up).  null → use the cost-aware
  # threshold selected by the gate (maximises net expectancy, not accuracy).
  # `confidence_threshold` used to be evolved by the GA and never read.
  confidence_threshold: null
  default_confidence_threshold: 0.55
  # Cost model: null → the `sim.cost_model` numbers (the same source real fills
  # use via app.config.sim_cost_quote).  Do not set a fee here unless you intend
  # the gate to use a cost the fills do not pay.
  taker_fee_pct: null
  half_spread_pct: null
  slippage_bps: null
  # null → follow `sim.cost_model.use_bnb_discount`.
  use_bnb_discount: null
  # Periodic retrain cadence used by MLPredictor._retrain_loop.
  retrain_interval_hours: 24
news:
  anomaly_threshold_pct: 3.0
  fetch_interval_minutes: 30
  max_articles_per_symbol: 10
  volume_spike_multiplier: 3.0
# Volatility targeting (Phase P3 — docs/core-algorithms/10-volatility-targeting.md).
# Conditional volatility is predictable (ARCH/GARCH: Tsay ch. 3) even though the
# direction of returns is not; these keys turn that forecast into RISK decisions
# (position size, stop/trailing width).  Every key defaults to the pre-P3
# behaviour, so `enabled: false` means the whole block is inert and sizing/stops
# are bit-identical to the fixed-fraction implementation.
#
# NOTE on naming: this is a NEW `risk:` block.  The `hard_limits` / `soft_params`
# blocks continue to come from config/risk_params.yaml — nothing there moved.
risk:
  vol_targeting:
    # Master switch. false → no vol targeting anywhere (P3 is fully opt-in).
    enabled: false
    # Estimator: 'ewma' (RiskMetrics λ=0.94, the documented default) |
    # 'realized_cc' | 'realized_parkinson' | 'realized_garman_klass' | 'garch11'.
    # Cheap methods are ~1 ms/bar; 'garch11' measures ~12 ms/bar and is for
    # research/reporting, not the hot path.
    method: ewma
    # EWMA decay and the bar window the estimator sees.
    lam: 0.94
    window: 500
    # Target volatility per trade, in PERCENT of price per bar (0.45 ≈ BTC 1h's
    # realised 0.42 %/bar).  The sizer scales the fixed-fraction notional by
    # target/forecast, so a symbol twice as volatile gets half the notional.
    target_vol_pct: 0.45
    # Bounds on that scale factor (1.0 = the fixed-fraction baseline).
    max_scale: 2.0
    min_scale: 0.25
    # Hard ceiling on the notional as a percent of account balance; applied AFTER
    # the vol scale so the existing hard limits can never be exceeded.
    max_position_notional_pct: 10.0
    # Stop / trailing width: distance = stop_atr_multiple × forecast vol per bar,
    # clamped to [stop_min_pct, stop_max_pct] (percent).  Only used when this
    # block is enabled; otherwise the fixed hard_limits.trailing_stop_distance_pct
    # and soft_params.stop_loss_pct apply unchanged.
    stop_vol_multiple: 3.0
    stop_min_pct: 0.5
    stop_max_pct: 6.0
    # ── RESERVED / CURRENTLY INERT (P3/P4 audit defect 5) ────────────────
    # Triple-barrier widths driven by the forecast.  These three keys are the
    # only input of PositionSizer.barrier_widths_pct, which NO production code
    # calls: the live label path takes its widths from the `ml.barrier_atr_period`
    # / `ml.barrier_atr_multiple` / `ml.barrier_min_pct` / `ml.barrier_max_pct`
    # keys (MLPredictor._barrier_params).  Setting a non-default value here
    # changes nothing and now logs a startup WARNING saying so (see
    # app/config.py:inert_barrier_key_warnings) instead of being silently
    # ignored.  Wiring them needs core/ml/predictor.py (or the manager's resolved
    # forecast), outside this change's write scope — do NOT document these as
    # effective until that lands.
    barrier_vol_multiple: 1.0
    barrier_min_pct: 0.004
    barrier_max_pct: 0.06
  # ── Volume-aware execution realism (P6-A) ──────────────────────────────
  # docs/core-algorithms/13-volume-liquidity-costs.md.  Volume is used here for
  # COST and CAPACITY, never for direction: a fill that is large relative to the
  # recent traded notional pays market impact, and an order that is a large
  # fraction of that notional cannot fill at the quoted price at all.
  #
  # SAFE DEFAULT: `enabled: false` and `impact_k: 0`.  With those two values
  # NOTHING changes — PositionSizer never calls the participation hook, and
  # core/backtest/cost_model.apply_trading_costs keeps the audited
  # `fees + spread/2` arithmetic bit-for-bit.  Both identities are pinned by
  # tests/test_liquidity.py.
  liquidity:
    # Master switch for the participation cap in PositionSizer (sizing path).
    enabled: false
    # Participation ceiling, in PERCENT of the lookback window's quote volume.
    # 1.0 = an order may be at most 1 % of what the market traded in the window.
    # The cap can only SHRINK a position; the hard caps stay authoritative.
    max_participation_pct: 1.0
    # Bars of quote volume that window covers (most recent bars, per interval).
    lookback_bars: 20
    # Market-impact law (core/backtest/cost_model.py):
    #   impact_pct = impact_k * participation ** impact_exponent   [% of notional]
    # `participation` is the FRACTION of recent quote volume (0.01 = 1 %) and the
    # result is charged per side, on entry and on exit.
    # 0.0 = the impact term is off (pre-P6 cost model, bit-identical results).
    # ILLUSTRATIVE, NOT CALIBRATED: see the doc's limitations section.  Raise it
    # only from a measured impact study, and state the venue/window it came from.
    impact_k: 0.0
    impact_exponent: 0.5
    # Optional per-symbol partial overrides; `default` (or `*`) covers the rest.
    # Example: {BTCUSDT: {max_participation_pct: 2.0}}
    per_symbol: {}
satellite_position:
  capital_pct: 0.3
  max_symbols: 10
signal_weights:
  indicator: 0.5
  ml: 0.3
  news: 0.2
sim:
  # Real cost model for the SIMULATED account (docs/overhaul/TRADE_PAGE_API.md §五之二).
  # Fills are made cost-aware instead of free: the buy fill is marked up and the
  # sell fill is marked down by (spread/2 + slippage), a fee is charged on each
  # side, and `pnl` is stored NET of all of it, so the balance identity
  # (10000 − open notional + realised = balance) keeps holding.
  cost_model:
    # Master switch. false → legacy behaviour: fill at the quoted price, zero fees.
    enabled: true
    # Default fee tier; the trader's manual selection in the UI persists to
    # system_config (`sim.fee_tier`) and overrides this on the next fill/estimate.
    fee_tier: VIP0
    # BNB fee discount. When true every rate is multiplied by 0.75 (25% off).
    use_bnb_discount: false
    # Per-side slippage in basis points (1 bp = 0.01%). Only market orders slip;
    # a limit order fills at its own limit price.
    slippage_bps: 2
    # FULL quoted bid-ask spread in percent, per symbol — NOT the per-side cost.
    # `BTCUSDT: 0.01` means a 1 bp book, and the fill model charges half of it on
    # each side (`spread_pct / 2`), exactly like `backtest.cost_model` below.
    # Missing symbol → `default` → 0.02 (= a 2 bp book → 1 bp per side).
    spread_pct:
      default: 0.02
      BNBUSDT: 0.03
      BTCUSDT: 0.01
      ETHUSDT: 0.02
      SOLUSDT: 0.03
      XRPUSDT: 0.04
web_port: 8899
